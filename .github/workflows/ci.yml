name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall src experiments/retrieval_ablation

      - name: Import smoke test
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "corpus.cli",
              "corpus.pipeline",
              "rag.app",
              "rag.config",
              "rag.ingest",
              "rag.pipeline",
              "rag.web_ui",
              "rag.generation.chain",
              "rag.retrieval.bm25",
              "rag.retrieval.hybrid",
              "rag.retrieval.rrf",
          ]

          for module in modules:
              importlib.import_module(module)

          print(f"Imported {len(modules)} modules")
          PY

      - name: CLI smoke test
        env:
          PYTHONPATH: src
        run: |
          python -m corpus.cli --help
          python -m rag.ingest --help
          python -m rag.app --help
          python -m rag.web_ui --help

      - name: Config smoke test
        env:
          PYTHONPATH: src
          KOMPAS_RAG_LLM_URL: http://localhost:8000/v1
          KOMPAS_RAG_LLM_MODEL: test-model
          KOMPAS_RAG_LLM_API_KEY: test-key
          KOMPAS_RAG_EMBEDDING_DEVICE: cpu
        run: python -c "from rag.config import load_config; cfg = load_config('configs/rag.yaml'); assert cfg.llm.base_url; assert cfg.llm.model_name"

      - name: Secret file smoke test
        run: |
          test ! -f .env
          test -f .env.example

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kompas-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
