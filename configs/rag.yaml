# Runtime configuration for the KOMPAS-3D RAG system.
# Secrets should stay in .env, not in this file.

embedding:
  model_name: intfloat/multilingual-e5-large-instruct
  device: cuda:0
  batch_size: 64
  max_length: 512

vectorstore:
  backend: chroma
  chroma_persist_dir: data/indexes/chroma_db
  collection_name: kompas_docs
  qdrant_url: http://localhost:6333
  qdrant_collection: kompas_docs

retriever:
  top_k: 15
  top_k_final: 5
  bm25_index_path: data/indexes/bm25_index.pkl
  score_threshold: 0.3
  filter_empty: true
  rrf_k: 60
  merge_chunks_per_file: 2

reranker:
  enabled: true
  model_name: BAAI/bge-reranker-v2-m3
  device: null
  candidates: 20
  top_k: 5
  max_length: 512
  batch_size: 16

query_rewrite:
  enabled: true
  max_queries: 3

llm:
  temperature: 0.3
  max_tokens: 16000
  top_p: null
  disable_thinking: false

docs_base_url: https://help.ascon.ru/KOMPAS/24/ru-RU
chunks_path: data/processed/chunks.jsonl
debug: false
