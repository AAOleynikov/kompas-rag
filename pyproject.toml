[project]
name = "kompas-rag"
version = "0.1.0"
description = ""
authors = [
    {name = "Anton_Oleynikov"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "chromadb>=0.5,<2",
    "gradio>=4,<6",
    "httpx>=0.27,<1",
    "langchain-chroma>=0.1,<1",
    "langchain-core>=0.3,<1",
    "langchain-huggingface>=0.1,<1",
    "langchain-openai>=0.2,<1",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "rank-bm25>=0.2,<1",
    "sentence-transformers>=3,<6",
    "torch>=2.3",
    "transformers>=4.40,<6"
]

[project.optional-dependencies]
qdrant = [
    "langchain-qdrant>=0.1,<1",
    "qdrant-client>=1.10,<2"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
